# MRV -- AprilTag vision capture of a free-floating 3 t MEP
# (Phase 1: linear drift, `mep.motion_mode: translation_only`; 6-DoF: `six_dof`).
#
# Loaded by `srb/tasks/manipulation/debris_capture/vision.py` (`load_vision_config`).
# Every value can be overridden from the command line of
# `project/scripts/vision_capture.py`, e.g. `--set mep.linear_velocity_mps=0.02`.
# Geometry-derived values (Cylinder_01 pose, grasp face, EE contact face) are NOT set
# here: they are measured from the spawned USD at startup and written to the logs.

mep:
  mass_kg: 3000.0
  # translation_only: Phase 1 linear drift (angular_velocity_rad_s is NOT applied)
  # six_dof:          XYZ drift + combined roll/pitch/yaw rate (angular_velocity_rad_s)
  #   ~/isaac-sim/python.sh project/scripts/vision_capture.py --scenario dynamic --set mep.motion_mode=six_dof
  motion_mode: six_dof
  # Linear velocity [m/s] (world, MEP centre of mass) = drift_direction * linear_velocity_mps
  # = [vx, vy, vz] = [0.0, -0.008, 0.006] m/s with the values below
  linear_velocity_mps: 0.01
  # World-frame drift direction (normalised at load time). Perpendicular to the arm's
  # approach axis (world +X) so the prediction has to lead the target sideways.
  drift_direction: [0.0, -0.8, 0.6]
  # six_dof only: [wx, wy, wz] [rad/s], WORLD frame (Isaac Lab init_state.ang_vel).
  # Low start value for the first Isaac Sim run: |w| = 0.0087 rad/s = 0.50 deg/s
  # (7.5 deg over the rendezvous time). Must stay below
  # prediction.max_plausible_angular_rate_rad_s.
  angular_velocity_rad_s: [0.005, -0.004, 0.006]
  # The MEP starts `rendezvous_time_s * linear_velocity_mps` upstream of its nominal
  # (reachability-checked) pose, so it drifts through the nominal pose during the run.
  # six_dof: the start orientation is also rotated back by Exp(-[w] t) about
  # Cylinder_01, so the MEP turns through the nominal orientation at the same time;
  # the position then passes the nominal only approximately (PhysX rotates the body
  # about its centre of mass -- see docs/04_scenario.md).
  rendezvous_time_s: 15.0
  # six_dof only. converge: the MEP turns into the nominal (parallel) orientation at
  # rendezvous_time_s (start orientation rotated back by Exp(-w t)); diverge: it starts in
  # the nominal orientation and turns away from it, so the arm chases the rotation.
  rotation_start: converge

camera:
  name: cam_wrist
  width: 1280
  height: 720
  # 90 deg (vertical +-29.4 deg): the tags around the 0.20 m marker must stay in view
  # at the final 50 mm gap (with 70 deg they would not fit)
  horizontal_fov_deg: 90.0
  # USD camera horizontal aperture [mm]; focal length is derived from the FOV
  horizontal_aperture_mm: 20.955
  clipping_range_m: [0.01, 100.0]
  # Mount on the Canadarm3 last link (canadarm3_large_7), on the EE axis, looking
  # along the capture direction (link -Z). The flange face is at z = -0.44 m and the
  # EE contact face (end of the capture cylinder) at z = -0.84 m.
  mount_link_z_m: -0.45
  # Roll about the viewing axis [deg], clockwise as seen from behind the camera
  # (0 = the old mount, image rolled 90 deg CCW; 90 = upright)
  image_roll_deg: 90.0
  # RTX anti-aliasing for the whole app: Off | FXAA | DLSS | TAA | DLAA
  antialiasing: "Off"
  # Render `supersample` x the resolution and area-downsample (anti-aliasing of the tag edges).
  # 1 (set for speed: ~3x faster in the 10 s timing test; accuracy over the whole scenario
  # still to be verified). 2 was the earlier value: single-image reprojection RMS
  # 0.63 -> 0.42 px in the static test
  supersample: 1
  # headless only: render only the frames the vision system uses (vision.rate_hz)
  render_on_vision_only: false

apriltag:
  family: tag36h11
  # Fixed IDs, in the order Tag0..Tag3 at (-d,+d), (+d,+d), (+d,-d), (-d,-d)
  ids: [0, 1, 2, 3]
  # Side of the black square (the detected corners) [m]
  tag_size_m: 0.06
  # d: tag centre offset from the constellation centre along each in-plane axis [m]
  # Outside the 0.20 m marker: nearest tag corner (with quiet zone) 216 mm from the axis
  constellation_half_width_m: 0.19
  # White quiet zone around each tag, in tag cells (a 36h11 tag is 8 cells wide)
  quiet_zone_cells: 1
  # Tags sit this far above the MEP attachment face (avoids z-fighting) [m]
  face_offset_m: 0.001
  texture_px_per_cell: 40
  # Pose is only valid with the full constellation (Phase 1 keeps all 4 in view)
  min_tags_for_pose: 4
  use_ransac: true
  ransac_reprojection_px: 3.0
  max_reprojection_rms_px: 1.5
  # Planar PnP ambiguity: when both IPPE solutions fit within this RMS factor, use the
  # one closer to the fused (window-mean) orientation
  ambiguity_ratio: 1.5

vision:
  rate_hz: 10.0
  # Last valid pose is held for this long when tags are lost, then the arm stops
  tag_loss_timeout_s: 1.0

prediction:
  # Prediction horizon [s] (simulation time)
  horizon_sec: 0.3
  # Least-squares velocity over the most recent estimates within this window [s]
  velocity_window_sec: 2.0
  # translation_only: constant orientation, averaged over this longer window [s].
  # Single-image tilt noise at the 1.0 m observation distance stays correlated for
  # ~1 s, so a 2 s mean left up to 0.58 deg; the static test samples once this
  # window was filled from the measured standoff.
  # six_dof: least-squares angular velocity + orientation fit over this window [s]
  orientation_window_sec: 5.0
  min_samples: 10
  # Estimated speed above this is rejected as a bad estimate [m/s]
  max_plausible_speed_mps: 0.2
  # six_dof: estimated angular rate above this is rejected as a bad estimate [rad/s]
  max_plausible_angular_rate_rad_s: 0.2
  # six_dof: frame fitted with constant linear + angular velocity, then mapped to
  # Cylinder_01 with a fixed transform.
  #   tag:     the PnP-measured tag constellation (vision + design-time T_T_Y only)
  #   mep_com: the MEP centre of mass (mass property read once from the model); the only
  #            point that moves in a straight line in free flight. With `tag`, the
  #            centripetal motion of the tags about the COM biases the fit by about
  #            |w|^2 r (T^2/12 + T h/2 + h^2/2): ~0.1 mm at 0.5 deg/s, ~7 mm at 5 deg/s (r ~ 2 m)
  reference_frame: tag

approach:
  # Start the scenario with the arm at the observation pose: nominal (configured)
  # rendezvous EE pose backed off `observe_distance_m` along the approach axis.
  # This is a configured search pose, not ground truth.
  start_at_observe_pose: true
  # 0.7 m kept each 60 mm tag at ~34 px with the 90 deg lens (36h11 decodes from ~30 px).
  # Now 0.6 m (-14 %, demo time; NEEDS_ISAAC_VALIDATION): the tags only get larger in the image.
  observe_distance_m: 0.6
  # Start the arm swung about its base axis (azimuth) by this angle [deg]: the wrist camera
  # then does not see the MEP and SEARCH swings the arm back until the tags are seen.
  # 0: start at the observation pose. (default 15; `--start_yaw_deg 0` on the command line for the observation pose)
  start_yaw_offset_deg: 15.0
  # SEARCH swing speed (arm without payload). The normal 5 cm tracking-lag gate caps it at
  # ~80 mm/s with the overdamped Canadarm3 drives, hence the wider gate / joint step here.
  # 0.25 / 0.20 / 0.08 was run: ~230 mm/s, tags found in 4.1 s from a 15 deg start. A more
  # aggressive 0.6 / 0.60 / 0.15 was tried afterwards and sent the arm off in the wrong
  # direction (a 0.6 m reference lead + 0.15 rad IK steps push the DLS IK to another
  # solution), so do not raise the lag / joint step much further.
  search_speed_mps: 0.25
  search_lag_m: 0.20
  search_max_joint_step_rad: 0.08
  # Stage A/B: track the predicted target this far in front of the MEP face [m]
  # (was 0.6; moved with observe_distance_m so the 0.1 m step between them is unchanged)
  approach_standoff_m: 0.5
  # Final EE-contact-face to MEP-face gap at capture [m]
  final_gap_m: 0.05
  # was 0.10 (+10 %, demo time; NEEDS_ISAAC_VALIDATION). Only the far leg to the standoff;
  # speed_near / speed_capture_range are unchanged
  speed_far_mps: 0.10
  speed_near_mps: 0.04
  speed_capture_range_mps: 0.01
  near_distance_m: 0.30   # standoff below which `speed_near` applies
  capture_range_m: 0.12   # standoff below which `speed_capture_range` applies
  speed_ang_deg_s: 6.0
  # Tracking gates: standoff only decreases while the EE is on the predicted axis
  gate_lateral_m: 0.01
  gate_angle_deg: 1.0
  settle_lateral_m: 0.02
  settle_angle_deg: 1.0
  max_joint_step_rad: 0.04
  ik_lambda: 0.05
  stage_timeout_s: 60.0

capture:
  # EE contact point <-> estimated Cylinder_01 centre. At the final gap this is
  # final_gap + 0.045 m (Cylinder_01 centre sits 45 mm below the tag plane).
  max_distance_m: 0.15
  max_angle_deg: 5.0
  max_relative_velocity_mps: 0.05
  # six_dof only (new condition): |w_EE - w_MEP| [rad/s]. 0.01 rad/s = 0.57 deg/s
  # (2 mm/s at the 0.2 m cylinder rim). Proposed value -- tune in Isaac Sim.
  max_relative_angular_velocity_rad_s: 0.01
  # Condition 4 (valid approach direction): EE on the outer side of the face and
  # within this lateral offset from the Cylinder_01 axis
  max_lateral_m: 0.02
  # Translucent EE capture cylinder sized to the Canadarm3 flange (link radius
  # 0.17 - 0.19 m there). The MEP marker Cylinder_01 is scaled to the same radius
  # (its position, orientation and height are unchanged): when aligned the two
  # overlap exactly, so any offset is visible. The wrist camera looks through it.
  cylinder_radius_m: 0.20
  # 1.0 = no refraction through the cylinder in front of the camera
  cylinder_ior: 1.0

test:
  static_position_threshold_mm: 5.0
  static_angle_threshold_deg: 0.5
  # Static test: observe the stationary MEP from these standoffs [m], N samples each
  static_standoffs_m: [0.7, 0.4, 0.2]
  static_samples: 30
  dynamic_timeout_sec: 60.0
  holding_duration_sec: 2.0
  holding_max_relative_drift_mm: 5.0
  holding_max_relative_drift_deg: 0.5
  # After holding, slowly back the EE off along the face normal with the MEP attached
  retreat_distance_m: 0.0
  retreat_speed_mps: 0.01

logging:
  dir: logs/vision_capture
  csv: logs/vision_capture_metrics.csv
  rate_hz: 10.0
  # Per-run metrics CSV on/off (the result JSON is always written)
  csv_enabled: true
  overlay_every_sec: 1.0
  # Isaac Sim debug draw (points, axes, velocity vectors); the 2D overlay is always saved
  debug_draw: true
  # Moving client only (visual, no effect on physics/control): trail of the client / MEP /
  # MRV positions every motion_trail_period_s with a fixed cross at each start position,
  # and a GUI window with the live speeds (`--moving_dock`, not shown headless)
  motion_trail: true
  motion_trail_period_s: 1.0
  motion_trail_max_points: 600
  motion_hud: true

ros:
  # ROS 2 interface (rclpy). On by default; `vision_capture.py --no_ros` (or --set ros.enabled=false) turns it off.
  # Topics (all under /<namespace>/):
  #   out:  cam_wrist/image_raw, cam_wrist/camera_info, estimate/cylinder_pose,
  #         predicted/cylinder_pose, estimate/mep_twist, ee/pose, ee/target_pose,
  #         gt/cylinder_pose, gt/mep_twist (evaluation only), state, captured, status, /tf
  #   in:   cmd/start (Empty), cmd/abort (Empty), cmd/capture_enable (Bool)
  enabled: true
  node_name: mrv_vision_capture
  namespace: mrv
  world_frame: world
  publish_rate_hz: 10.0
  publish_image: true
  publish_tf: true
  publish_ground_truth: true
  # true: the arm holds at the observation pose until cmd/start arrives
  require_start_cmd: false
  distro: jazzy

mrv:
  # Rendezvous phase in front of the verified capture pipeline (`mrv_approach.py`):
  #   folded arm -> MRV translation step 1 -> step 2 -> arm deploy -> SEARCH (existing)
  # The MRV here is the Canadarm3 base plus the spacecraft hull it sits on; both are
  # translated rigidly (the base is a fixed-base articulation, the hull a static prim).
  # false: the demo starts exactly as it did before -- arm at the observation pose, MRV
  # at its nominal pose (`vision_capture.py --no_mrv_approach`).
  enabled: true
  # World-frame offset of the MRV START pose from its nominal pose [m]. The two legs
  # cancel it exactly, so from the arm deployment on, the scene is the configuration the
  # capture / transport / docking pipeline was verified in.
  # The approach axis is world +X (docking.placement.approach_dir) and the MEP sits at
  # x ~ +5 m, so -X starts the MRV further back and -Z below it: leg 1 is a horizontal
  # run towards the MEP, leg 2 a climb to the working height.
  start_offset_m: [-5.0, 0.0, -3.0]
  # Per-axis fraction of `start_offset_m` cancelled by leg 1 (leg 2 cancels the rest).
  # [1, 1, 0] = horizontal leg first, vertical leg second.
  step1_axis_mask: [1.0, 1.0, 0.0]
  # Transit reference: trapezoidal (accelerate, cruise, decelerate into the target).
  # 5.0 m + 3.0 m at 0.4 m/s ~ 13 s + 9 s, so both steps are clearly visible without
  # stretching the demo.
  speed_mps: 0.4
  accel_mps2: 0.15
  # Arrival is judged on the distance to the leg target, not on elapsed time
  position_tolerance_m: 0.02
  settle_time_s: 1.0
  # Folded (stowed) arm, `canadarm3_large_joint_1..7` [deg]. Joints 2-5 at zero already
  # fold the two 3.66 m booms back onto each other (the elbow still swings up to 4.25 m
  # before folding back down -- unavoidable given the boom length, and clear of the hull
  # either way); joint 1 keeps the azimuth of the arm's own init_state (50 deg) so the
  # deployment only unfolds the booms. Joint 6 (135 deg) tucks the wrist close ABOVE the
  # shoulder -- a vertical stow (EE 1.32 m up, 0.72 m sideways, reach 1.50 m) instead of
  # out to the side (-90 deg gave 0.59 m up but 2.17 m sideways, reach 2.24 m).
  folded_joint_deg: [50.0, 0.0, 0.0, 0.0, 0.0, 135.0, 0.0]
  # Joint-space interpolation from the folded pose to the pose the existing pipeline
  # starts from (the observation pose, or the yawed start pose with --start_yaw_deg)
  deploy_duration_s: 10.0
  # Upper bound on the settling time after the ramp; the state ends as soon as every
  # joint is within deploy_tolerance_deg of the target (1.5 s left 0.36 deg / 57 mm at
  # the EE, more than the 30 mm SEARCH treats as "arrived")
  deploy_settle_s: 4.0
  deploy_tolerance_deg: 0.1
  stage_timeout_s: 120.0
  # The MEP keeps drifting and turning during the approach, so it must start further
  # upstream for its nominal rendezvous pose to be reached when the CAPTURE starts:
  # `mep.rendezvous_time_s` is extended by this many seconds. < 0: auto (the planned
  # duration of the approach + deployment).
  mep_rendezvous_delay_s: -1.0
  # Thruster plume -- visual only, on separate prims, no collider and no physics force.
  # On during the two translation legs, off everywhere else (deploy, search, capture,
  # transport, docking). A failure to create it never stops the pipeline.
  vfx_enabled: true
  plume_length_m: 2.5
  plume_radius_m: 0.45
  plume_flicker: 0.18
  # Mid-plume colour, with the near-nozzle core fading through it to the diffuse tail
  # colour below -- the hot-core -> cooling-tail gradient a real thruster plume shows.
  plume_color: [0.55, 0.78, 1.0]
  plume_core_color: [0.85, 0.93, 1.0]
  plume_tail_color: [1.0, 0.55, 0.15]
  # Spread of the 4 plumes over the exhaust face, as a fraction of the thruster box
  # half extent, and how far the nozzle sits inside the hull silhouette
  plume_spread: 0.45
  plume_inset: 0.85
  # "flow": volumetric fire (Omniverse Flow, RTX), "cones": translucent cone meshes.
  # "flow" falls back to "cones" if omni.flowusd cannot be loaded.
  vfx_style: flow
  # The voxel size trades detail for GPU time
  fire_speed_mps: 25.0
  fire_cooling_rate: 1.5
  # exhaust density fade; keep it above fire_cooling_rate (else the cooled gas shows as a dark trail)
  fire_fade_rate: 6.0
  fire_length_m: 5.0
  fire_cell_size_m: 0.07

docking:
  # Phase 2: the captured MEP's Ares1 probe is docked into the satellite thruster.
  # On by default; `vision_capture.py --no_dock` turns it off. Frames come from
  # `docking.py` (PROBE_DOCK_POINT = probe tip, SAT_DOCK_POINT = `dock_depth` inside
  # the nozzle); all errors are expressed in the satellite dock frame, never world XYZ.
  enabled: true
  # true: skip the AprilTag capture and start with the MEP attached at its nominal grasp
  # pose (docking iteration speed; capture itself is covered by the other scenarios)
  skip_capture: false
  # Hold before the docking transport starts [s] (was 1.0; 0 = straight on)
  settle_time_s: 0.0

  # Satellite free drift [m/s] (world). This phase is translation only: no rotation is
  # applied to the satellite or the MEP (`mep.motion_mode: translation_only`).
  satellite_velocity_mps: 0.0
  satellite_drift_direction: [0.0, -1.0, 0.0]

  # Probe tip standoff in front of the nozzle exit at the pre-dock pose [m]
  pre_dock_distance_m: 1.0

  # Alignment gate, measured in the dock frame before any insertion
  align_lateral_m: 0.05
  align_axis_deg: 12.0
  align_roll_deg: 5.0
  align_hold_s: 0.5
  # The probe tip must also be at rest before inserting (max displacement over the window)
  # At least half of the arm + payload period (~20 s): a short window is satisfied at
  # every turning point of an oscillation that is still running
  settle_window_s: 3.0
  settle_window_m: 0.05

  # Transport to the pre-dock pose (free space): the probe tip has to be swung about
  # 4.8 m sideways (5.5 m before the dock_offset change) onto the thruster axis, so this
  # is the speed that sets the run time
  # 0.10 m/s is the carry speed the existing GT docking demo used for the same payload;
  # 0.25 m/s left the 3 t payload swinging +-150 mm at the pre-dock pose
  # Now 0.11 m/s (+10 %, demo time; NEEDS_ISAAC_VALIDATION: 0.10 is the verified value).
  # The sideways distance is also shorter: the satellite is placed with
  # dock_offset (0, 4.8, 0) m instead of (0, 5.5, 0) m (`vision_task.py`, VISION_DOCK_OFFSET_M)
  transport_speed_mps: 0.15

  # Docking-axis approach: fast far away, controlled near, slow for the insertion
  # (far leg only, was 0.10; near / insertion / align speeds are unchanged)
  approach_speed_mps: 0.15
  slow_zone_m: 0.20
  near_speed_mps: 0.07
  insertion_zone_m: 0.06
  insertion_speed_mps: 0.03
  # Slow on purpose: a correction finished in much less than the arm + 3 t payload period
  # (~20 s) re-excites that mode and the residual swing then sits on the alignment gate
  align_speed_mps: 0.015
  align_speed_deg_s: 2.0
  # Continuous deceleration (v <= decel_gain_hz * remaining distance, min creep_speed_mps)
  # instead of an on/off target: stopping the reference abruptly rings the lightly damped
  # arm + 3 t payload mode (period ~20 s)
  decel_gain_hz: 0.08
  # docking-axis (z) approach only (`decel_gain_hz` still applies to transport / alignment)
  z_decel_gain_hz: 0.3
  creep_speed_mps: 0.005
  # Ramp-up limit [m/s^2]: stepping the commanded speed kicks the 3 t payload sideways
  accel_mps2: 0.01
  # Active damping of the arm + 3 t payload swing (0 disables): the joint velocity target
  # is biased against the measured probe-tip velocity error
  # (Tried at 1.0: destabilised the arm within 0.1 s, the drives already have a large
  # velocity gain. Off by default.)
  swing_damping: 0.0
  # Anti-windup for the held joint target, in multiples of the per-step joint limit
  joint_target_windup: 5.0
  # Closed loop: forward motion stops and the demo re-aligns when the alignment leaves
  # these (wider than the gate above, so a resumed approach does not abort at once)
  approach_abort_lateral_m: 0.20
  approach_abort_axis_deg: 12.0

  # Docking conditions -- all of them must hold before the FixedJoint is created
  dock_axial_m: 0.04
  dock_radial_m: 0.04
  dock_axis_deg: 2.0
  dock_roll_deg: 4.0
  max_relative_velocity_mps: 0.05
  min_wall_clearance_m: 0.02

  # `cam_probe` depth: distance_to_image_plane along the docking axis, compared with
  # the distance computed from the frames. An invalid/disagreeing reading stops the
  # approach (there is no blind-advance fallback).
  depth_enabled: true
  depth_patch_px: 9
  depth_min_m: 0.05
  depth_max_m: 12.0
  depth_agreement_m: 0.15
  # Offset from SAT_DOCK_POINT to the surface the ray hits [m]; measured once at the
  # pre-dock pose when `auto_calibrate` is true (the collision-only back plate is not
  # rendered, so the ray lands on the thruster mesh behind it)
  depth_surface_offset_m: 0.1
  auto_calibrate: true
  # The ray lands on the inside of the bell nozzle, so the reading depends on the lateral
  # offset: calibrated 41 mm off the axis, every on-axis reading later disagreed by a
  # constant 320 mm and the approach never advanced. Calibrate on the axis only (median
  # of N samples); the Z approach waits for it.
  depth_calibration_max_lateral_m: 0.015
  depth_calibration_max_axis_deg: 1.0
  depth_calibration_samples: 10
  require_depth: true

  # 240 s per state, as in the existing GT docking demo: the 5.5 m transport of the 3 t
  # payload converges without oscillation but takes ~150 s at these speeds
  stage_timeout_s: 240.0
  # Whole docking phase: a pair of states bouncing between each other keeps resetting
  # the per-state timeout, so the phase needs its own budget
  phase_timeout_s: 600.0
  hold_duration_s: 3.0

probe_camera:
  # RGB-D camera on the Ares1 probe, used by the docking phase. It sits on the probe
  # axis `offset_from_tip_m` in front of the tip, looking along the insertion
  # direction, so the rod never occludes the ray used for the depth reading. RGB is for
  # watching the approach; depth (distance_to_image_plane) measures the docking-axis
  # distance. Position and orientation are measured from the spawned USD at startup
  # (PROBE_DOCK_POINT in `docking.py`), not hard-coded.
  enabled: true
  name: cam_probe
  width: 640
  height: 480
  horizontal_fov_deg: 70.0
  horizontal_aperture_mm: 20.955
  clipping_range_m: [0.01, 30.0]
  offset_from_tip_m: 0.02
  # Roll about the viewing axis [deg], clockwise as seen from behind the camera
  # (0 = the old mount, image rolled 90 deg CCW; 90 = upright)
  image_roll_deg: 90.0
  rgb_every_sec: 1.0

## ---------------------------------------------------------------------------------
## Moving-client docking (`moving_dock.py`, `vision_capture.py --moving_dock`)
##   capture (or --dock_only) -> CLIENT_RELEASE -> CLIENT_CRUISE -> CHASE
##   -> VELOCITY_MATCHING -> RENDEZVOUS -> existing docking states -> DOCKED
##   -> STABILIZING -> STOPPING -> ROBOT_RELEASE -> ARM_RETREAT -> MRV_SEPARATION -> SUCCESS
## World frame, SI units. Vectors are [x, y, z] (a {x:, y:, z:} mapping also works in
## this file; `--set` overrides need the list form, e.g.
## --set "client.linear_velocity_mps=[0.02,0,0]").
## Every rendezvous / docking gate is on RELATIVE velocity (body - client): the world
## velocities do not have to be zero to dock.
## ---------------------------------------------------------------------------------
client:
  # false: the satellite (client) stays at rest and `--dock` runs exactly as before.
  # `vision_capture.py` turns this on by default (off with --no_moving_dock / --no_dock /
  # --scenario static); the config default stays false for other callers and the tests
  release_enabled: false
  # true: released at t = 0 -- the client drifts through the MRV approach and the capture,
  # the MRV joins it at the docking handover (d_ref = the NOMINAL client -> MRV offset, so
  # the MRV first closes the gap the drift opened; the insertion waits for it)
  release_at_start: true
  # +X = the docking (insertion) axis = the arm's approach direction, so the MRV chases
  # along its own approach axis and departs straight back along it (-X, auto)
  linear_velocity_mps: [0.02, 0.0, 0.0]
  # The MRV only translates: a rotating client is not a verified configuration
  angular_velocity_rad_s: [0.0, 0.0, 0.0]
  # The release is a thrust ramp on the client (F = m a), never a velocity write
  release_accel_mps2: 0.004
  release_ang_accel_rad_s2: 0.002
  release_time_constant_s: 0.5
  velocity_tolerance_mps: 0.0005
  angular_tolerance_rad_s: 0.0005
  release_timeout_s: 30.0
  # CLIENT_CRUISE: free drift observed this long before the chase. 0 = skipped (demo).
  # Test 1 of the spec: --set client.cruise_check_s=5.0
  cruise_check_s: 0.0
  cruise_max_velocity_change_mps: 0.0005
  max_speed_mps: 0.2
  max_angular_rate_rad_s: 0.05

rendezvous:
  # Closed loop v_cmd = v_client + clip(Kp * e, max_correction), e = (p_client - p_mrv) - d_ref.
  # Demo default: the MRV keeps its station from the release on (no gap, no chase), so the
  # docking starts ~1 s after the client is up to speed. Test 2 of the spec (MRV starts
  # slower than the client, ~0.2 m gap, ~16 s of rendezvous):
  #   --set "rendezvous.mrv_initial_velocity_mps=[0.015,0.0,0.0]" --set rendezvous.mrv_follow_during_release=false
  mrv_initial_velocity_mps: []
  mrv_follow_during_release: true
  # true: no waiting states -- the docking starts at once, the release + MRV station keeping
  # run next to the transport, and the matching / station gates below are checked right
  # before the docking-axis approach. Spec's sequential states (Tests 1, 2):
  #   --set rendezvous.concurrent_docking=false (+ the Test 1 / Test 2 overrides above)
  concurrent_docking: true
  # Forced insertion: from the pre-dock point on, the MEP always closes on the client along
  # the docking axis at >= insertion_min_relative_speed_mps (no swing-settle wait; the
  # depth reading is logged but does not hold the approach). It only re-aligns outside
  # this wider corridor or closer than docking.min_wall_clearance_m to the nozzle wall;
  # the FixedJoint still needs every docking.dock_* condition. false = the verified
  # (settle + depth-gated) insertion.
  forced_insertion: true
  insertion_min_relative_speed_mps: 0.005
  insertion_max_axis_deg: 12.0
  insertion_max_lateral_m: 0.20
  mrv_max_accel_mps2: 0.004
  position_gain_hz: 0.25
  max_correction_speed_mps: 0.02
  max_mep_client_relative_velocity_mps: 0.005
  max_mrv_client_relative_velocity_mps: 0.005
  # MRV back on its verified station (the docking was verified with the MRV exactly there)
  max_relative_position_m: 0.05
  stable_duration_sec: 1.0
  # Gate velocities = least-squares slope of the measured positions over this window
  velocity_window_s: 0.5
  # Added to the existing docking.* conditions while the client moves
  dock_max_mrv_client_relative_velocity_mps: 0.005
  dock_max_mep_client_relative_velocity_mps: 0.01
  dock_max_relative_position_m: 0.1
  chase_timeout_s: 30.0
  velocity_match_timeout_s: 90.0
  rendezvous_timeout_s: 90.0

post_docking:
  # true: DOCKED -> release the grip at once; the docked MEP + client stack stops by thrust
  # (stop_* below) in the background while the MRV reverses from its current motion and
  # departs along separation.direction -- no waiting states. false: STABILIZING -> STOPPING
  # (all three stop) -> ROBOT_RELEASE -> ARM_RETREAT -> MRV_SEPARATION
  immediate_release: true
  # STABILIZING: the docked stack keeps drifting, MEP-client drift must stay small
  stabilization_sec: 2.0
  max_drift_mm: 5.0
  max_drift_deg: 0.5
  # STOPPING: common deceleration a = clip(-v / tau, a_max) as F = m a on client AND MEP;
  # the MRV follows through its relative hold, so no joint takes the stopping load
  stop_accel_mps2: 0.002
  stop_time_constant_s: 3.0
  stop_ang_accel_rad_s2: 0.001
  stop_ang_time_constant_s: 3.0
  stop_velocity_tolerance_mps: 0.001
  stop_angular_tolerance_rad_s: 0.0005
  stop_hold_sec: 1.0
  stop_timeout_s: 90.0
  # ROBOT_RELEASE: only the robot <-> MEP capture joint is removed; the MEP <-> client
  # docking joint stays
  release_wait_sec: 0.5
  release_timeout_s: 5.0

separation:
  # ARM_RETREAT: the EE backs off the MEP face along its normal before the MRV moves
  arm_retreat_distance_m: 0.6
  arm_retreat_speed_mps: 0.03
  arm_retreat_timeout_s: 90.0
  # [] = auto: -normalize(client.linear_velocity_mps)
  direction: []
  velocity_mps: 0.4
  accel_mps2: 0.1
  duration_sec: 15.0
  min_distance_increase_m: 0.1
  max_contact_force_n: 50.0
  timeout_s: 90.0
  # MRV_SEPARATION: arm back to the start pose (folded with mrv.enabled), joint-space
  # smoothstep; starts after the delay so the EE first clears the MEP face
  arm_stow: true
  arm_stow_delay_s: 4.0
  arm_stow_duration_s: 10.0

## ---------------------------------------------------------------------------------
## Astrobee satellite observation (`astrobee.py`, `vision_capture.py --no_astrobee`)
##   ASTROBEE_IDLE -> ASTROBEE_APPROACH -> ASTROBEE_OBSERVATION_START
##   -> ASTROBEE_OBSERVING (inspection points around the satellite) -> ASTROBEE_OBSERVATION_COMPLETE
## An observation / monitoring camera only: it computes nothing, decides nothing and
## never touches the MEP capture / docking pipeline (visual model, no collider). Its one
## output is the camera image on ROS 2 (/astrobee/camera/image_raw, when ros.enabled).
## Model: NASA astrobee_media meshes (Apache-2.0), `project/scripts/build_astrobee_usd.py`.
## World frame, SI units.
## ---------------------------------------------------------------------------------
astrobee:
  enabled: true
  usd_relpath: astrobee/astrobee.usd
  prim_name: astrobee
  # Display scale of the 0.32 m model (the scene's satellite is x3.5, the MRV hull x3.4)
  scale: 3.0
  start_delay_s: 0.0
  # Straight-in approach to inspection point 1 from this far outside the ring
  approach_distance_m: 20.0
  approach_speed_mps: 1.0
  # Ring radius = satellite horizontal AABB half-diagonal + margin; ring height from the elevation
  orbit_margin_m: 25.0
  elevation_deg: 25.0
  # Azimuth [deg] about world +Z from the direction satellite centre -> docking port
  inspection_azimuths_deg: [45.0, 135.0, 225.0, 315.0]
  dwell_s: 5.0
  transit_speed_mps: 2.0
  # Camera aim between the satellite centre (0) and its docking port (1)
  look_at_dock_weight: 0.5
  # Full loops before ASTROBEE_OBSERVATION_COMPLETE (0 = until the run ends)
  loops: 0
  # MRV_SEPARATION: close in on the departing MRV at this speed on top of the MRV's own
  # (trapezoid, accel below) down to the standoff distance from the MRV root
  follow_close_speed_mps: 3.0
  follow_close_accel_mps2: 1.0
  follow_standoff_m: 10.0
  ros_namespace: astrobee
  ros_node_name: astrobee_observer
  image_topic: camera/image_raw
  camera:
    name: cam_astrobee
    width: 640
    height: 480
    horizontal_fov_deg: 70.0
    horizontal_aperture_mm: 20.955
    clipping_range_m: [0.1, 1000.0]
    # NASA `sci_cam_transform` (body frame: +X forward, +Z down), scaled with the model
    mount_pos_body_m: [0.118, 0.0, -0.096]
    publish_rate_hz: 5.0
    # PNG frame every N s under logs/vision_capture/<tag>_astrobee/ (0 = off)
    save_every_s: 0.0
